; PlatformIO configuration for ESP32 Smart Water Meter
; https://docs.platformio.org/en/latest/boards/espressif32.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.partitions = default

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
